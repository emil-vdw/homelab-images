name: CI Build and Scan

on:
  pull_request: {}
  push:
    branches: ["main"]
    paths:
      - "images/**"
      - ".github/workflows/ci-build-scan.yaml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-images: ${{ steps.matrix.outputs.has-images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build matrix
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          declare -A selected=()

          select_image() {
            local image="$1"
            if [[ ! "$image" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
              echo "Invalid image directory name: $image" >&2
              exit 1
            fi
            [[ -f "images/$image/Dockerfile" ]] && selected["$image"]=1
          }

          select_all_images() {
            while IFS= read -r -d '' directory; do
              select_image "${directory##*/}"
            done < <(find images -mindepth 1 -maxdepth 1 -type d -print0)
          }

          select_changed_images() {
            local range="$1"
            local path image
            while IFS= read -r -d '' path; do
              case "$path" in
                .github/workflows/ci-build-scan.yaml)
                  select_all_images
                  ;;
                images/*/*)
                  image="${path#images/}"
                  select_image "${image%%/*}"
                  ;;
              esac
            done < <(git diff --name-only -z "$range" --)
          }

          case "$EVENT_NAME" in
            pull_request)
              select_changed_images "$BASE_SHA...$HEAD_SHA"
              ;;
            push)
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
                select_all_images
              else
                select_changed_images "$BEFORE_SHA..$HEAD_SHA"
              fi
              ;;
            workflow_dispatch)
              select_all_images
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ ${#selected[@]} -eq 0 ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'has-images=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix="$({
            for image in "${!selected[@]}"; do
              printf '%s\n' "$image"
            done
          } | LC_ALL=C sort | jq -Rsc '
            split("\n")[:-1]
            | {include: map({
                image: .,
                context: ("images/" + .),
                dockerfile: ("images/" + . + "/Dockerfile")
              })}
          ')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo 'has-images=true' >> "$GITHUB_OUTPUT"

  build-and-scan:
    needs: build-matrix
    if: ${{ needs.build-matrix.outputs.has-images == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: local/${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Upstream renamed its tags from `0.x.y` to `v0.x.y` and deleted the
      # old unprefixed names, so both `0.33.1` and `0.34.0` 404 today and
      # every job fails at "Set up job" before any image is built. Keep the
      # `v` prefix on any future bump.
      #
      # trivy-action@v0.33.1's default Trivy version (v0.65.0) has a git
      # tag but no published GitHub release, so its own binary download
      # 404s too. Pin an explicit version with real release assets until
      # the action's default catches up.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: local/${{ matrix.image }}:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: v0.74.0

  # Matrix job names change as images are added. Branch protection targets this
  # stable summary instead of an individual matrix child.
  ci-success:
    name: ci-success
    if: ${{ always() }}
    needs: [build-matrix, build-and-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.build-matrix.result }}
          BUILD_RESULT: ${{ needs.build-and-scan.result }}
          HAS_IMAGES: ${{ needs.build-matrix.outputs.has-images }}
        run: |
          set -euo pipefail

          [[ "$MATRIX_RESULT" == "success" ]]
          if [[ "$HAS_IMAGES" == "true" ]]; then
            [[ "$BUILD_RESULT" == "success" ]]
          else
            [[ "$HAS_IMAGES" == "false" ]]
            [[ "$BUILD_RESULT" == "skipped" ]]
          fi
